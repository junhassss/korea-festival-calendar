<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전국축제달력 | 이번 주말 어디 갈까?</title><meta name="description" content="대한민국 전국의 축제와 행사를 날짜와 지역으로 빠르게 찾아보세요."><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#0f172a;background:#f8fafc}a{text-decoration:none;color:inherit}button,input{font:inherit}header{position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid #e2e8f0;backdrop-filter:blur(12px)}nav{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px;font-weight:900}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f97316;color:white;font-size:20px}.links{display:flex;gap:28px;font-size:14px;font-weight:700;color:#475569}.hero{background:radial-gradient(circle at 85% 10%,#fed7aa,transparent 30%),linear-gradient(120deg,#fff,#fff7ed);border-bottom:1px solid #ffedd5}.hero-inner{max-width:1180px;margin:auto;padding:70px 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px}.eyebrow,.date{color:#ea580c;font-weight:900;font-size:14px}.eyebrow{display:inline-block;background:#fff;padding:10px 14px;border-radius:99px;box-shadow:0 4px 18px #0f172a12}.hero h1{font-size:64px;line-height:1.05;letter-spacing:-3px;margin:20px 0 14px}.orange{color:#f97316}.sub{font-size:18px;color:#64748b}.search{display:flex;gap:8px;background:#fff;padding:8px;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 14px 40px #0f172a18;margin-top:30px;max-width:590px}.search input{flex:1;border:0;outline:0;padding:12px}.search button,.cta{border:0;background:#0f172a;color:#fff;padding:13px 20px;border-radius:12px;font-weight:900}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.filters button,.regions button{border:1px solid #fed7aa;background:#fff;padding:9px 14px;border-radius:99px;font-weight:800;color:#334155}.pick{position:relative;overflow:hidden;min-height:340px;border-radius:32px;background:radial-gradient(circle at 80% 20%,#f9731688,transparent 32%),radial-gradient(circle at 20% 90%,#0ea5e955,transparent 34%),#0f172a;padding:32px;color:white;display:flex;flex-direction:column;justify-content:space-between}.pick h2{font-size:32px;margin:12px 0}.pick p{color:#cbd5e1}.cta{background:#f97316;border-radius:99px;width:max-content}.recommend{display:none;background:#ffffff18;padding:15px;border-radius:16px}.section{max-width:1180px;margin:auto;padding:55px 20px}.title{display:flex;align-items:end;justify-content:space-between}.title h2{font-size:32px;margin:8px 0}.regions{display:flex;gap:8px;overflow:auto;margin:28px 0 20px}.regions button.active{background:#0f172a;color:#fff;border-color:#0f172a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{overflow:hidden;background:white;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 10px 30px #0f172a0d;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px #0f172a1a}.photo{height:190px;background-size:cover;background-position:center;position:relative}.badge{position:absolute;left:14px;top:14px;background:#0f172acc;color:white;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:900}.heart{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:white;font-size:20px}.body{padding:18px}.meta{font-size:12px;color:#ea580c;font-weight:900}.body h3{font-size:20px;margin:10px 0}.info{color:#64748b;font-size:14px;line-height:1.8}.empty{text-align:center;padding:60px;border:1px dashed #cbd5e1;border-radius:24px;background:white}footer{border-top:1px solid #e2e8f0;background:white;padding:35px 20px;text-align:center;color:#64748b}@media(max-width:900px){.links{display:none}.hero-inner{grid-template-columns:1fr}.hero h1{font-size:46px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero-inner{padding:40px 20px}.hero h1{font-size:40px}.grid{grid-template-columns:1fr}.title{display:block}.photo{height:230px}}</style></head><body><header><nav><a class="logo" href="#"><span class="mark">✦</span>전국축제달력</a><div class="links"><a href="#festivals">홈</a><a href="#festivals">이번 주말</a><a href="#festivals">지역</a><a href="#festivals">찜한 축제</a></div><span>⌕</span></nav></header><main><section class="hero"><div class="hero-inner"><div><span class="eyebrow">✦ 대한민국에서 지금 열리는 축제를 한눈에</span><h1>이번 주말,<br><span class="orange">어디 갈까?</span></h1><p class="sub">전국에서 열리는 축제를 날짜와 지역으로 찾아보세요.</p><div class="search"><input id="query" placeholder="축제명 또는 지역 검색"><button onclick="render()">검색</button></div><div class="filters"><button>오늘</button><button>이번 주말</button><button>진행중</button><button>무료</button><button>야간</button></div></div><div class="pick"><div><b style="color:#fdba74">WEEKEND PICK</b><h2>결정이 어려운 날엔<br>한 번에 골라드려요.</h2><p>현재 지역 조건에 맞는 이번 주말 축제 중 하나를 추천해요.</p></div><div id="recommend" class="recommend"></div><button class="cta" onclick="surprise()">🎲 이번 주말 뭐하지?</button></div></div></section><section id="festivals" class="section"><div class="title"><div><p class="date">9월 26일 토요일 — 27일 일요일</p><h2>이번 주말 전국에서 열리는 축제</h2><p id="count" class="sub"></p></div></div><div id="regions" class="regions"></div><div id="grid" class="grid"></div></section></main><footer><b>전국축제달력</b><br><small>공공 관광데이터를 더 가볍게 만나는 주말 여행 도구</small></footer><script>const festivals=[
{title:'한강 빛섬축제',region:'서울',city:'서초구',date:'9.18(금) — 10.4(일)',cat:'공연',free:true,status:'진행중',img:'https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=900&q=80'},
{title:'수원화성 문화제',region:'경기',city:'수원시',date:'9.25(금) — 9.28(월)',cat:'전통',free:false,status:'이번 주말',img:'https://images.unsplash.com/photo-1535189043414-47a3c49a0bed?auto=format&fit=crop&w=900&q=80'},
{title:'강릉 커피 여행 주간',region:'강원',city:'강릉시',date:'9.24(목) — 9.30(수)',cat:'먹거리',free:true,status:'이번 주말',img:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80'},
{title:'부산 바다미술제',region:'부산',city:'사하구',date:'9.12(토) — 10.18(일)',cat:'자연',free:true,status:'진행중',img:'https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=900&q=80'},
{title:'전주 비빔밥 축제',region:'전북',city:'전주시',date:'9.26(토) — 9.27(일)',cat:'먹거리',free:true,status:'이번 주말',img:'https://images.unsplash.com/photo-1498654896293-37aacf113fd9?auto=format&fit=crop&w=900&q=80'},
{title:'인천 개항장 문화유산 야행',region:'인천',city:'중구',date:'9.26(토) — 9.27(일)',cat:'야시장',free:true,status:'이번 주말',img:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=80'},
{title:'백제문화제',region:'충남',city:'공주시',date:'9.25(금) — 10.4(일)',cat:'전통',free:false,status:'이번 주말',img:'https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=900&q=80'},
{title:'제주 해녀축제',region:'제주',city:'제주시',date:'9.26(토) — 9.27(일)',cat:'체험',free:true,status:'이번 주말',img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80'}];let region='전체';const regionList=['전체',...new Set(festivals.map(f=>f.region))];function render(){const q=document.querySelector('#query').value;const list=festivals.filter(f=>(region==='전체'||f.region===region)&&(f.title+f.region+f.city).includes(q));document.querySelector('#count').textContent=list.length+'개의 설레는 주말이 기다리고 있어요.';document.querySelector('#regions').innerHTML=regionList.map(r=>`<button class="${r===region?'active':''}" onclick="region='${r}';render()">${r} ${r==='전체'?festivals.length:festivals.filter(f=>f.region===r).length}</button>`).join('');document.querySelector('#grid').innerHTML=list.length?list.map((f,i)=>`<article class="card"><div class="photo" style="background-image:url('${f.img}')"><span class="badge">${f.status}</span><button class="heart" onclick="this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button></div><div class="body"><span class="meta">${f.cat} · ${f.free?'무료':'유료'}</span><h3>${f.title}</h3><div class="info">⌖ ${f.region} ${f.city}<br>▣ ${f.date}</div></div></article>`).join(''):'<div class="empty">조건에 맞는 축제를 찾지 못했어요.</div>'}function surprise(){const list=festivals.filter(f=>region==='전체'||f.region===region);const f=list[Math.floor(Math.random()*list.length)];const el=document.querySelector('#recommend');el.style.display='block';el.innerHTML=`<small style="color:#fdba74;font-weight:900">오늘의 추천</small><br><b style="font-size:20px">${f.title}</b><br><small>${f.region} · ${f.cat}을 즐기기 좋아요</small>`}document.querySelector('#query').addEventListener('input',render);render();</script></body></html>
